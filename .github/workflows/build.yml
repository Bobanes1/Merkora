name: Build Merkora

# Builds the desktop app for Windows, Linux and macOS.
# - every push / pull request: installers as downloadable workflow artifacts
# - a tag like v0.2.0: additionally a draft GitHub release with all installers
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux packages for Tauri
        timeout-minutes: 40
        # GitHub's Ubuntu mirror sometimes hangs: short timeouts, and after a failed try switch to the official mirror
        run: |
          APT="-o Acquire::http::Timeout=15 -o Acquire::Retries=2"
          for i in 1 2 3; do
            if timeout 300 sudo apt-get $APT update && timeout 400 sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf; then exit 0; fi
            echo "apt try $i failed – switching to another mirror"
            sudo sed -i -e "s|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            [ $i = 2 ] && sudo sed -i -e "s|http://archive.ubuntu.com/ubuntu|http://mirror.math.princeton.edu/pub/ubuntu|g" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            sleep 10
          done
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run test:srs
      - run: npm run test:anki
      - run: npm run test:office
      - name: Rust tests (Anki import)
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html && cargo test --manifest-path src-tauri/Cargo.toml --lib

  # On a tag: create the draft release once, so the parallel builds all upload into the same release.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 ||
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft \
            --title "Merkora ${{ github.ref_name }}" --notes "Installer für Windows, Linux und macOS."

  build:
    needs: [test, release]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux packages for Tauri
        if: startsWith(matrix.platform, 'ubuntu')
        timeout-minutes: 40
        # GitHub's Ubuntu mirror sometimes hangs: short timeouts, and after a failed try switch to the official mirror
        run: |
          APT="-o Acquire::http::Timeout=15 -o Acquire::Retries=2"
          for i in 1 2 3; do
            if timeout 300 sudo apt-get $APT update && timeout 400 sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf; then exit 0; fi
            echo "apt try $i failed – switching to another mirror"
            sudo sed -i -e "s|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            [ $i = 2 ] && sudo sed -i -e "s|http://archive.ubuntu.com/ubuntu|http://mirror.math.princeton.edu/pub/ubuntu|g" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            sleep 10
          done
          exit 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installers so the app can update itself (in-app updates check latest.json)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Without the signing secret the build skips update signatures (they can be added to the release afterwards).
          args: ${{ matrix.args }} ${{ secrets.TAURI_SIGNING_PRIVATE_KEY == '' && '--config src-tauri/ci-unsigned.conf.json' || '' }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Merkora ${{ github.ref_name }}'
          releaseBody: 'Installer für Windows (.exe/.msi), Linux (.deb/.rpm/.AppImage) und macOS (.dmg).'
          releaseDraft: true
          includeUpdaterJson: true
      - uses: actions/upload-artifact@v4
        with:
          name: merkora-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # Android app (APK). Signed with the key from the secrets ANDROID_KEYSTORE (base64 of the .p12 file),
  # ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS – the same key every time, so a new APK installs over the old one.
  android:
    needs: [test, release]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner already has an Android SDK (ANDROID_HOME); only the parts Merkora needs are added.
      - name: Android SDK parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      - run: npm ci
      - name: Android project
        run: |
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/icon.png
          node scripts/android-patch.cjs
      - name: Build APK
        run: npx tauri android build --apk --target aarch64 armv7
      - name: Sign APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -n 1)
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > merkora.p12
            "$BT/apksigner" sign --ks merkora.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" --out "Merkora_${VERSION}_android.apk" aligned.apk
            rm merkora.p12
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            # no key yet: a test build with a throw-away key (installs, but later versions cannot be installed over it)
            keytool -genkeypair -keystore test.p12 -storetype PKCS12 -storepass testtest -alias test -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Merkora Test"
            "$BT/apksigner" sign --ks test.p12 --ks-pass pass:testtest --out "Merkora_${VERSION}_android-test.apk" aligned.apk
            echo "::warning::ANDROID_KEYSTORE fehlt – nur ein Test-APK mit Wegwerf-Schlüssel gebaut."
          fi
          "$BT/apksigner" verify Merkora_*_android*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: merkora-android
          path: Merkora_*_android*.apk
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" Merkora_*_android.apk --clobber --repo "${{ github.repository }}"
